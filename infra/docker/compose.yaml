# Jobber - local development services
#
#   cp .env.example .env     first time only, then set real values
#   docker compose up -d     start everything (first run downloads ~8 GB)
#   docker compose ps        wait until every service is "healthy"
#   docker compose down      stop, keep data   (down -v also deletes all data)
#
# Run from infra/docker, or add `-f infra/docker/compose.yaml` from the project root.
# Start only some:  docker compose up -d redis mongodb mysql postgres rabbitmq
#
#   Service        Port         Used for
#   redis          6379         cache, Socket.IO adapter (no password)
#   mongodb        27017        users, gig, chat, order data (no password)
#   mysql          3306         auth data
#   postgres       5432         review data
#   rabbitmq       5672, 15672  message broker, management UI
#   elasticsearch  9200         gig search, logs
#   kibana         5601         dashboards, APM
#
# Rules: local only (ports bound to 127.0.0.1) | logins come from .env | data in named
# volumes (MySQL failed to restart on a bind mount) | image tags pinned, and
# Elasticsearch and Kibana always share one version | every service has a memory
# reservation/limit sized from real docker stats, so one runaway service can't OOM the rest.

name: jobber

services:
  # ----- Data stores -----------------------------------------------------------

  # Cache and Socket.IO adapter.
  redis:
    container_name: redis_container
    image: redis:8.10-alpine
    restart: unless-stopped
    command: redis-server --loglevel warning
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Users, gig, chat and order data.
  mongodb:
    container_name: mongodb_container
    image: mongo:8.0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 768M
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Auth data. Database and user are created on the first start only (see .env).
  mysql:
    container_name: mysql_container
    image: mysql:8.4
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_USER=${MYSQL_USER:?set MYSQL_USER in .env}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 768M
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Review data. Same first-start rule as MySQL.
  # Version 18 keeps data in /var/lib/postgresql (not .../postgresql/data).
  postgres:
    container_name: postgres_container
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB in .env}
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----- Messaging -------------------------------------------------------------

  # Message broker. UI at http://localhost:15672. The fixed hostname keeps its data
  # folder name stable, because RabbitMQ names it after the node.
  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
    ports:
      - "127.0.0.1:5672:5672"   # AMQP (used by the services)
      - "127.0.0.1:15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----- Search and observability ----------------------------------------------

  # Gig search and logs. Security is on (user "elastic"); plain HTTP, local only.
  # Apps connect with http://elastic:<ELASTIC_PASSWORD>@localhost:9200
  elasticsearch:
    container_name: elasticsearch_container
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    deploy:
      resources:
        reservations:
          memory: 1G
        limits:
          memory: 2G
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200/_cluster/health | grep -Eq '"status":"(green|yellow)"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # One-shot job: sets the password of Kibana's internal kibana_system user, then
  # exits. Kibana cannot connect without it. Safe to re-run. Do not delete.
  elasticsearch-setup:
    container_name: elasticsearch_setup_container
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 128M
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl -sf -X POST -u "elastic:$$ELASTIC_PASSWORD"
        -H "Content-Type: application/json"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$$KIBANA_PASSWORD\"}"
        && echo "kibana_system password set"

  # Dashboards at http://localhost:5601 (log in as "elastic"). Settings that are not
  # secret are in kibana.yml, the rest comes from the environment below. The first
  # start downloads the APM integration, so it needs internet access.
  kibana:
    container_name: kibana_container
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: unless-stopped
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    deploy:
      resources:
        reservations:
          memory: 1.5G
        limits:
          memory: 2.5G
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

# Named volumes (created as jobber_<name>).
volumes:
  redis_data:
  mongodb_data:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  elasticsearch_data:
